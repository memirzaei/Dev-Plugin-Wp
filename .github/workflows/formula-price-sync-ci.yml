# ==============================================================================
# Formula Price Sync – Continuous Integration
# ==============================================================================
# Root-level GitHub Actions workflow for the formula-price-sync monorepo member.
# Runs smoke, quality, PHPUnit, real MySQL CAS, real WordPress/WooCommerce/HPOS,
# and the deterministic marketplace build.
# ==============================================================================

name: Formula Price Sync CI

on:
  push:
    branches: [main, master, develop, 'release/**']
    paths:
      - 'formula-price-sync/**'
      - '.github/workflows/formula-price-sync-ci.yml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'formula-price-sync/**'
      - '.github/workflows/formula-price-sync-ci.yml'
  workflow_dispatch:
    inputs:
      skip_build:
        description: 'Skip release ZIP build'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: fps-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.2', '8.3']
    defaults:
      run:
        working-directory: formula-price-sync
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
          ini-values: display_errors=On, error_reporting=E_ALL

      - name: PHP syntax check (production)
        run: |
          set -e
          find includes formula-price-sync.php uninstall.php -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: PHP syntax check (tests)
        run: |
          set -e
          find tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Unit smoke runners
        run: |
          php tests/run-smoke.php
          php tests/run-r07r08.php
          php tests/run-r09r11r12r13.php

      - name: Allow Composer installer plugin
        run: composer config --global --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true

      - name: Install Composer dev dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHPCS
        run: composer run lint:phpcs

      - name: Static policy scan
        run: php bin/check-static-quality.php

      - name: Metadata consistency
        run: bash bin/check-metadata-consistency.sh

      - name: HPOS smoke-install harness
        run: php tests/smoke-install-hpos.php

  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest
    needs: smoke
    defaults:
      run:
        working-directory: formula-price-sync
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, dom, json
          tools: composer:v2
          coverage: none

      - name: Allow Composer installer plugin
        run: composer config --global --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true

      - name: Install Composer dev dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPUnit
        run: vendor/bin/phpunit --configuration phpunit.xml.dist --no-coverage

  mysql-concurrency:
    name: Real MySQL CAS concurrency
    runs-on: ubuntu-latest
    needs: smoke
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: fps_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: formula-price-sync
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, pcntl
          coverage: none

      - name: Run real MySQL CAS gate
        env:
          FPS_INTEGRATION_MYSQL: '1'
          FPS_DB_HOST: 127.0.0.1
          FPS_DB_PORT: 3306
          FPS_DB_USER: root
          FPS_DB_PASS: root
          FPS_DB_NAME: fps_test
        run: php tests/Integration/real-mysql-cas.php

  wp-integration:
    name: WP + WooCommerce (PHP ${{ matrix.php }}, WP ${{ matrix.wp }}, WC ${{ matrix.wc }})
    runs-on: ubuntu-latest
    needs: smoke
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2']
        wp: ['6.4', 'latest']
        wc: ['8.9.0', 'latest']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, zip
          tools: composer:v2

      - name: Install WP-CLI
        run: |
          curl -sO https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x wp-cli.phar
          sudo mv wp-cli.phar /usr/local/bin/wp

      - name: Scaffold WordPress test site
        working-directory: ${{ runner.temp }}
        run: |
          set -e
          mkdir -p wp
          cd wp
          wp core download --allow-root --version=${{ matrix.wp == 'latest' && 'latest' || matrix.wp }}
          wp config create --allow-root             --dbname=wordpress_test             --dbuser=root             --dbpass=root             --dbhost=127.0.0.1             --skip-check
          wp core install --allow-root             --url=http://localhost             --title="FPS CI"             --admin_user=admin             --admin_password=admin             --admin_email=admin@example.test             --skip-email

      - name: Install WooCommerce
        working-directory: ${{ runner.temp }}/wp
        run: |
          set -e
          if [ "${{ matrix.wc }}" = "latest" ]; then
            wp plugin install woocommerce --activate --allow-root
          else
            wp plugin install woocommerce --version=${{ matrix.wc }} --activate --allow-root
          fi

      - name: Enable HPOS
        working-directory: ${{ runner.temp }}/wp
        run: |
          wp option update woocommerce_custom_orders_table_enabled yes --allow-root || true
          wp option update woocommerce_feature_custom_order_tables_enabled yes --allow-root || true

      - name: Install plugin under test
        working-directory: ${{ runner.temp }}/wp
        run: |
          set -e
          ln -s "$GITHUB_WORKSPACE/formula-price-sync" wp-content/plugins/formula-price-sync
          wp plugin activate formula-price-sync --allow-root

      - name: Prepare real E2E license state
        working-directory: ${{ runner.temp }}/wp
        run: |
          wp eval 'update_option("fps_license_status", "valid", false); set_transient("fps_license_validation", array("valid"=>true,"time"=>time(),"expires_at"=>time()+DAY_IN_SECONDS), DAY_IN_SECONDS);' --allow-root

      - name: Run real WP/WC/HPOS E2E
        working-directory: ${{ runner.temp }}/wp
        run: |
          set -e
          wp eval-file wp-content/plugins/formula-price-sync/tests/Integration/real-wp-wc-hpos-e2e.php prepare --allow-root
          wp action-scheduler run --hooks=fps_process_queue_continuation --group=fps-price-sync --force --allow-root
          wp eval-file wp-content/plugins/formula-price-sync/tests/Integration/real-wp-wc-hpos-e2e.php verify --allow-root

      - name: Run local smoke automation
        working-directory: ${{ runner.temp }}/wp
        env:
          FPS_SKIP_PHPUNIT: '0'
          FPS_SKIP_SYNC: '1'
          FPS_ALLOW_ROOT: '1'
        run: |
          set -e
          chmod +x wp-content/plugins/formula-price-sync/bin/run-smoke-local.sh
          wp-content/plugins/formula-price-sync/bin/run-smoke-local.sh             --path="$(pwd)"             --allow-root             --skip-sync

  build:
    name: Build marketplace ZIP
    runs-on: ubuntu-latest
    needs: [smoke, phpunit, mysql-concurrency, wp-integration]
    if: ${{ github.event.inputs.skip_build != 'true' }}
    defaults:
      run:
        working-directory: formula-price-sync
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, dom, json
          tools: composer:v2

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rsync zip unzip

      - name: Allow Composer installer plugin
        run: composer config --global --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true

      - name: Install build dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate and build release package
        env:
          FPS_TESTS_ALREADY_PASSED: '1'
          FPS_ZHAKET_PRODUCT_TOKEN: ${{ secrets.FPS_ZHAKET_PRODUCT_TOKEN }}
        run: bash bin/build-release.sh

      - name: Verify reproducible release build
        run: bash bin/check-release-reproducibility.sh

      - name: Verify release metadata
        run: bash bin/check-metadata-consistency.sh

      - name: Upload ZIP artefact
        uses: actions/upload-artifact@v4
        with:
          name: formula-price-sync-2.0.0
          path: formula-price-sync/build/formula-price-sync-2.0.0.zip
          if-no-files-found: error
          retention-days: 14
